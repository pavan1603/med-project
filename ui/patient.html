<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediRisk - Patient</title>
    <link rel="stylesheet" href="css/patient.css">
</head>
<body>
    <aside>
        <h1>Medi<span>Risk</span></h1>
        <p id="user-name">Patient</p>
        <small id="patient-uid">Patient</small>
        <button data-view="summary" class="active">My Summary</button>
        <button data-view="chat">My Chatbot</button>
        <button id="logout-btn">Logout</button>
    </aside>
    <main>
        <header><div><small>Patient Portal</small><h2 id="page-title">My Summary</h2></div></header>
        <section id="view-summary" class="view active">
            <div class="panel">
                <h3>My Health Summary</h3>
                <div id="patient-summary" class="list"></div>
            </div>
        </section>
        <section id="view-chat" class="view">
            <div class="panel">
                <h3>My Chatbot</h3>
                <p>Open the chatbot with your saved report context.</p>
                <button id="open-chat-btn">Open Chatbot</button>
            </div>
        </section>
    </main>
    <script src="js/hospital-api.js"></script>
    <script src="js/role-common.js"></script>
    <script src="js/patient.js"></script>
</body>
</html>
