<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediRisk - Receptionist</title>
    <link rel="stylesheet" href="css/receptionist.css">
</head>
<body>
    <aside>
        <h1>Medi<span>Risk</span></h1>
        <p id="user-name">Receptionist</p>
        <small id="hospital-name">Hospital</small>
        <button data-view="patients" class="active">Patients & Reports</button>
        <button data-view="prediction">Quick Prediction</button>
        <button id="logout-btn">Logout</button>
    </aside>
    <main>
        <header><div><small id="header-hospital">Hospital</small><h2 id="page-title">Register Patients</h2></div></header>
        <section id="view-patients" class="view active">
            <div class="panel">
                <h3>Register Patient</h3>
                <form id="patient-form" class="grid">
                    <label>Full Name<input id="patient-name" required></label>
                    <label>Date of Birth<input id="patient-dob" type="date"></label>
                    <label>Gender<select id="patient-gender"><option value="unknown">Unknown</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></label>
                    <label>Phone<input id="patient-phone"></label>
                    <label>Language<select id="patient-language"><option value="en">English</option><option value="te">Telugu</option><option value="hi">Hindi</option></select></label>
                    <label>Address<input id="patient-address"></label>
                    <button type="submit">Register Patient</button>
                </form>
                <p id="patient-message"></p>
            </div>
            <div class="panel">
                <h3>Search Patients</h3>
                <div class="row"><input id="patient-search"><button id="patient-search-btn">Search</button></div>
                <div id="patient-results" class="list"></div>
            </div>
            <div class="panel">
                <h3>Create Patient Report</h3>
                <form id="report-form" class="grid"></form>
                <p id="report-message"></p>
                <div id="report-output" class="list"></div>
            </div>
        </section>
        <section id="view-prediction" class="view">
            <div class="panel">
                <h3>Quick Prediction</h3>
                <p>Run diabetes or simple heart screening without saving a patient report.</p>
                <form id="standalone-prediction-form" class="grid"></form>
                <p id="standalone-prediction-message"></p>
                <div id="standalone-prediction-output" class="list"></div>
            </div>
        </section>
    </main>
    <script src="js/hospital-api.js"></script>
    <script src="js/role-common.js"></script>
    <script src="js/receptionist.js"></script>
</body>
</html>
